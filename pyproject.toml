[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dependency-risk-api"
version = "0.1.0"
description = "Automated dependency security intelligence API"
requires-python = ">=3.13"

dependencies = [
    "fastapi",
    "httpx",
    "pydantic",
    "x402[evm]"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "workers-py>=1.9",
    "workers-runtime-sdk"
]
